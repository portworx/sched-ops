sudo: required
dist: bionic
language: go
go:
  - "1.24.4"
before_install:
  - echo $PATH
  - which go
  - ls -al $(which go)
  - sudo find / -name go
install:
  - ls -al $(which go)
  - $(which go) version
  - make fetch-tools
  - make vendor
script:
  - make git-validation
  - make fmt
  - make vet
  - make test
  - make lint
